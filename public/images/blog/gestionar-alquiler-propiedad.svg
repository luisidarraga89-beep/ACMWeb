<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Ilustración editorial sobre gestión profesional de alquiler de propiedades">
  <defs>
    <linearGradient id="bgAlquilar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2044"/>
      <stop offset="100%" stop-color="#A85E08"/>
    </linearGradient>
    <pattern id="dotsAlquilar" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.3" fill="rgba(255,255,255,0.10)"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgAlquilar)"/>
  <rect width="1600" height="1000" fill="url(#dotsAlquilar)"/>
  <circle cx="1170" cy="420" r="330" fill="rgba(255,255,255,0.05)"/>

  <!-- key -->
  <g transform="translate(980,320) rotate(-14)" stroke="rgba(251,248,244,0.85)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="44" cy="44" r="38"/>
    <line x1="80" y1="74" x2="220" y2="214"/>
    <line x1="170" y1="164" x2="170" y2="210"/>
    <line x1="198" y1="192" x2="198" y2="238"/>
  </g>

  <!-- calendar / contract -->
  <g transform="translate(1180,500)" stroke="#F5A033" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="20" width="190" height="160" rx="10"/>
    <line x1="0" y1="70" x2="190" y2="70"/>
    <line x1="40" y1="0" x2="40" y2="40"/>
    <line x1="150" y1="0" x2="150" y2="40"/>
    <line x1="35" y1="110" x2="80" y2="110"/>
    <line x1="35" y1="140" x2="120" y2="140"/>
  </g>

  <text x="80" y="120" font-family="Georgia, serif" font-style="italic" font-size="44" fill="rgba(251,248,244,0.9)">ACM</text>
  <text x="80" y="900" font-family="Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="3" fill="rgba(251,248,244,0.55)">ALQUILAR · GESTIÓN DE PROPIEDADES</text>
</svg>
