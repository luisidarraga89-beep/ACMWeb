<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Ilustración editorial sobre cómo valorar una vivienda para la venta">
  <defs>
    <linearGradient id="bgVender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2044"/>
      <stop offset="100%" stop-color="#1A3366"/>
    </linearGradient>
    <pattern id="dotsVender" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.3" fill="rgba(255,255,255,0.10)"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgVender)"/>
  <rect width="1600" height="1000" fill="url(#dotsVender)"/>
  <circle cx="1180" cy="430" r="330" fill="rgba(255,255,255,0.05)"/>

  <!-- house outline -->
  <g transform="translate(960,220)" stroke="rgba(251,248,244,0.85)" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 190 L200 40 L400 190 V420 H0 Z"/>
    <line x1="60" y1="280" x2="150" y2="280"/>
    <line x1="60" y1="330" x2="180" y2="330"/>
  </g>

  <!-- price tag -->
  <g transform="translate(1180,470) rotate(18)" stroke="#F5A033" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 60 L60 0 H160 V100 L100 160 Z"/>
    <circle cx="100" cy="40" r="12" fill="#F5A033" stroke="none"/>
  </g>

  <!-- ascending value line -->
  <g stroke="rgba(251,248,244,0.55)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(940,640)">
    <polyline points="0,80 90,40 180,60 280,-20"/>
  </g>

  <text x="80" y="120" font-family="Georgia, serif" font-style="italic" font-size="44" fill="rgba(251,248,244,0.9)">ACM</text>
  <text x="80" y="900" font-family="Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="3" fill="rgba(251,248,244,0.55)">VENDER · VALORACIÓN DE VIVIENDA</text>
</svg>
