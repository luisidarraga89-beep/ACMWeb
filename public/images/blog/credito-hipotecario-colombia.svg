<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Ilustración editorial sobre crédito hipotecario y compra de vivienda">
  <defs>
    <linearGradient id="bgComprar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2044"/>
      <stop offset="100%" stop-color="#0453A6"/>
    </linearGradient>
    <pattern id="dotsComprar" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.3" fill="rgba(255,255,255,0.10)"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgComprar)"/>
  <rect width="1600" height="1000" fill="url(#dotsComprar)"/>
  <circle cx="1180" cy="430" r="330" fill="rgba(255,255,255,0.05)"/>

  <!-- house outline -->
  <g transform="translate(980,220)" stroke="rgba(251,248,244,0.85)" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 190 L200 40 L400 190 V420 H0 Z"/>
    <path d="M140 420 V270 H260 V420"/>
    <line x1="290" y1="90" x2="290" y2="150"/>
  </g>

  <!-- key -->
  <g transform="translate(1010,470) rotate(-18)" stroke="#F5A033" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="40" cy="40" r="34"/>
    <line x1="72" y1="66" x2="190" y2="184"/>
    <line x1="150" y1="144" x2="150" y2="184"/>
    <line x1="176" y1="170" x2="176" y2="200"/>
  </g>

  <!-- ascending approval arrow -->
  <g stroke="rgba(251,248,244,0.55)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(940,610)">
    <polyline points="0,90 70,30 140,60 230,-30"/>
    <polyline points="180,-30 230,-30 230,20"/>
  </g>

  <text x="80" y="120" font-family="Georgia, serif" font-style="italic" font-size="44" fill="rgba(251,248,244,0.9)">ACM</text>
  <text x="80" y="900" font-family="Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="3" fill="rgba(251,248,244,0.55)">COMPRAR · CRÉDITO HIPOTECARIO</text>
</svg>
